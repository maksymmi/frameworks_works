<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Система Консьєрж</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="{% url 'dashboard' %}">Журнал Консьєржа</a>
            {% if user.is_authenticated %}
                <span class="navbar-text text-white me-auto ms-3">
                    Користувач: <strong>{{ user.username }}</strong> ({{ user.get_role_display }})
                </span>
                <a href="{% url 'logout' %}" class="btn btn-outline-danger btn-sm">Вийти</a>
            {% endif %}
        </div>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
