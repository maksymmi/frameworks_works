{% extends 'concierge/base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card mt-4 shadow">
            <div class="card-header text-center bg-dark text-white"><h4>Реєстрація персоналу</h4></div>
            <div class="card-body">
                <form method="POST">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary w-100 mb-2">Створити аккаунт</button>
                </form>
                <div class="text-center">
                    <a href="{% url 'login' %}">Вже є аккаунт? Увійти</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
